name: Publish Mikrozia Container

# The only supported Mikrozia production release: a versioned RouterOS OCI
# image. A release is a tag (or an explicit dispatch of the canonical version);
# merges to main never publish. Every published architecture is built, started,
# and checked against the RouterOS runtime contract before the manifest push.

on:
  push:
    tags:
      - "v*-mikrozia"
      - "v*.*.*-mikrozia.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Docker tag, for example v1-mikrozia"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mikrozia-docker-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  IMAGE_NAME: majlot/mikrozia
  # Must stay in sync with the smoke matrix below and with the docs/tests.
  SUPPORTED_PLATFORMS: "linux/amd64,linux/arm64/v8,linux/arm/v7"

jobs:
  validate:
    name: Validate RouterOS container release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      xray_version: ${{ steps.xray_version.outputs.xray_version }}
      mtg_version: ${{ steps.mtg_version.outputs.mtg_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release tag
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          canonical_version="$(sh scripts/build/verify-mikrozia-version.sh --canonical-only)"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${DISPATCH_VERSION}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            echo "Mikrozia releases are published from version tags or workflow_dispatch only." >&2
            exit 1
          fi
          if [[ "${release_tag}" != "${canonical_version}" ]]; then
            echo "Release tag '${release_tag}' does not match canonical MIKROZIA_VERSION '${canonical_version}'." >&2
            exit 1
          fi
          echo "RELEASE_TAG=${release_tag}" >> "$GITHUB_ENV"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        shell: bash
        run: sh scripts/build/verify-mikrozia-version.sh "$RELEASE_TAG" > /dev/null

      - name: Resolve and validate Xray version
        id: xray_version
        shell: bash
        run: |
          xray_version="$(tr -d '[:space:]' < XRAY_VERSION)"
          if [[ ! "$xray_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid XRAY_VERSION: $xray_version" >&2
            echo "Expected format: vMAJOR.MINOR.PATCH (e.g. v26.10.21)" >&2
            exit 1
          fi
          echo "XRAY_VERSION=${xray_version}" >> "$GITHUB_ENV"
          echo "xray_version=${xray_version}" >> "$GITHUB_OUTPUT"

      - name: Resolve and validate MTG version
        id: mtg_version
        shell: bash
        run: |
          mtg_version="$(tr -d '[:space:]' < MTG_VERSION)"
          if [[ ! "$mtg_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid MTG_VERSION: $mtg_version" >&2
            echo "Expected format: vMAJOR.MINOR.PATCH (e.g. v1.16.1)" >&2
            exit 1
          fi
          echo "MTG_VERSION=${mtg_version}" >> "$GITHUB_ENV"
          echo "mtg_version=${mtg_version}" >> "$GITHUB_OUTPUT"

      - name: Run Mikrozia compatibility tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Validate shell syntax
        run: |
          bash -n DockerEntrypoint.sh
          sh -n DockerInit.sh
          sh -n scripts/build/verify-xray-checksum.sh
          sh -n scripts/build/verify-mtg-checksum.sh
          sh -n scripts/build/verify-geo-checksum.sh
          sh -n scripts/build/verify-acme-checksum.sh
          sh -n scripts/build/verify-mikrozia-version.sh
          bash -n x-ui.sh

      - name: Assert firewall-free runtime image
        shell: bash
        run: |
          if grep -E -i '\b(iptables|ip6tables|nftables|ufw|fail2ban)\b' DockerEntrypoint.sh Dockerfile x-ui.sh; then
            echo "The MikroTik container image must not include firewall-management tooling or commands." >&2
            exit 1
          fi

  smoke:
    name: Build and smoke-test ${{ matrix.platform }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            xray_bin: xray-linux-amd64
            mtg_bin: mtg-linux-amd64
            integration: true
          - platform: linux/arm64/v8
            arch: arm64
            xray_bin: xray-linux-arm64
            mtg_bin: mtg-linux-arm64
            integration: false
          - platform: linux/arm/v7
            arch: armv7
            xray_bin: xray-linux-arm32
            mtg_bin: mtg-linux-arm
            integration: false
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      XRAY_VERSION: ${{ needs.validate.outputs.xray_version }}
      MTG_VERSION: ${{ needs.validate.outputs.mtg_version }}
      SMOKE_IMAGE: mikrozia-smoke:${{ needs.validate.outputs.release_tag }}-${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        if: matrix.arch != 'amd64'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local ${{ matrix.platform }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: ${{ env.SMOKE_IMAGE }}
          build-args: |
            MIKROZIA_VERSION=${{ env.RELEASE_TAG }}
            XRAY_VERSION=${{ env.XRAY_VERSION }}
            MTG_VERSION=${{ env.MTG_VERSION }}

      - name: Verify RouterOS runtime contract
        shell: bash
        run: |
          set -euo pipefail
          image="$SMOKE_IMAGE"
          platform="${{ matrix.platform }}"
          report_failure() {
            {
              echo "### RouterOS runtime contract: FAIL"
              echo ""
              echo "- image: \`${image}\`"
              echo "- platform: \`${platform}\`"
              echo "- failed check: ${1}"
              if [ -n "${2:-}" ]; then
                echo ""
                echo '```'
                echo "${2}"
                echo '```'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=RouterOS runtime contract::${1}"
            exit 1
          }
          docker image inspect "$image" >/dev/null || report_failure "image missing from the runner daemon" ""
          actual_mikrozia_ver=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$image")
          test "$actual_mikrozia_ver" = "$RELEASE_TAG" || report_failure "OCI version label mismatch" "actual=${actual_mikrozia_ver} expected=${RELEASE_TAG}"
          runtime_err=$(mktemp)
          runtime_mikrozia_ver=$(docker run --rm --platform "$platform" --entrypoint /app/x-ui "$image" -v 2>"${runtime_err}") || report_failure "panel binary did not report its version" "$(cat "${runtime_err}")"
          expected_runtime_mikrozia_ver="Mikrozia ${RELEASE_TAG%-mikrozia}"
          test "$runtime_mikrozia_ver" = "$expected_runtime_mikrozia_ver" || report_failure "runtime version mismatch" "actual=${runtime_mikrozia_ver} expected=${expected_runtime_mikrozia_ver} stderr=$(cat "${runtime_err}")"
          actual_xray_ver=$(docker inspect --format '{{ index .Config.Labels "io.mikrozia.xray.version" }}' "$image")
          test "$actual_xray_ver" = "$XRAY_VERSION" || report_failure "Xray version label mismatch" "actual=${actual_xray_ver} expected=${XRAY_VERSION}"
          actual_mtg_ver=$(docker inspect --format '{{ index .Config.Labels "io.mikrozia.mtg.version" }}' "$image")
          test "$actual_mtg_ver" = "$MTG_VERSION" || report_failure "mtg version label mismatch" "actual=${actual_mtg_ver} expected=${MTG_VERSION}"
          xray_no_v="${XRAY_VERSION#v}"
          xray_out=$(docker run --rm --platform "$platform" --entrypoint "/app/bin/${{ matrix.xray_bin }}" "$image" version 2>&1) || report_failure "Xray binary did not run" "${xray_out}"
          echo "$xray_out"
          grep -Fq "Xray ${xray_no_v}" <<< "$xray_out" || report_failure "Xray binary version output mismatch" "${xray_out}"
          mtg_no_v="${MTG_VERSION#v}"
          mtg_out=$(docker run --rm --platform "$platform" --entrypoint "/app/bin/${{ matrix.mtg_bin }}" "$image" --version 2>&1) || report_failure "mtg binary did not run" "${mtg_out}"
          echo "$mtg_out"
          grep -Fq "${mtg_no_v}" <<< "$mtg_out" || report_failure "mtg binary version output mismatch" "${mtg_out}"
          contract_output=$(docker run --rm --platform "$platform" --entrypoint /bin/sh "$image" -ec '
            test -x /app/x-ui
            test -x /app/DockerEntrypoint.sh
            test -x /app/bin/${{ matrix.xray_bin }}
            test -x /app/bin/${{ matrix.mtg_bin }}
            test -f /app/bin/geoip.dat
            test -f /app/bin/geosite.dat
            test -f /app/bin/geoip_IR.dat
            test -f /app/bin/geosite_IR.dat
            test -f /app/bin/geoip_RU.dat
            test -f /app/bin/geosite_RU.dat
            test -f /app/GEO_DATA_SOURCES
            while read -r geo_file geo_url geo_sha; do
              case "$geo_file" in "" | "#"*) continue ;; esac
              printf "%s  %s\n" "$geo_sha" "/app/bin/$geo_file" | sha256sum -c -
            done < /app/GEO_DATA_SOURCES
            test -f /app/ACME_SOURCES
            test -x /usr/local/share/acme.sh/acme.sh
            test -f /usr/local/share/acme.sh/dnsapi/dns_cf.sh
            grep -Eq "^acme\.sh\.tar\.gz https://github\.com/acmesh-official/acme\.sh/archive/[0-9a-f]{40}\.tar\.gz [0-9a-f]{64}\$" /app/ACME_SOURCES
            test ! -e /app/update.sh
            test ! -e /app/verify-xray-checksum.sh
            test ! -e /app/scripts/build/verify-xray-checksum.sh
            test ! -e /app/verify-mtg-checksum.sh
            test ! -e /app/scripts/build/verify-mtg-checksum.sh
            test -d /etc/x-ui
            test -d /root/cert
            test "$XUI_IN_DOCKER" = true
            test "$HOME" = /root
            ! grep -Fq "/server/getXrayVersion" /app/x-ui
            ! grep -Fq "/server/installXray" /app/x-ui
          ' 2>&1) || report_failure "image content contract" "${contract_output}"
          {
            echo "### RouterOS runtime contract: PASS"
            echo ""
            echo "- image: \`${image}\`"
            echo "- platform: \`${platform}\`"
            echo "- release tag: \`${RELEASE_TAG}\`"
            echo "- xray version: \`${XRAY_VERSION}\`"
            echo "- mtg version: \`${MTG_VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run image integration tests (amd64)
        if: matrix.integration
        env:
          MIKROZIA_TEST_IMAGE: ${{ env.SMOKE_IMAGE }}
        run: python3 -m unittest tests.test_first_login_and_credentials

  publish:
    name: Publish multi-architecture image
    needs: [validate, smoke]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      XRAY_VERSION: ${{ needs.validate.outputs.xray_version }}
      MTG_VERSION: ${{ needs.validate.outputs.mtg_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Mikrozia
            org.opencontainers.image.description=3x-ui adapted for MikroTik RouterOS containers
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            io.mikrozia.xray.version=${{ env.XRAY_VERSION }}
            io.mikrozia.mtg.version=${{ env.MTG_VERSION }}

      - name: Build and push smoke-tested RouterOS architectures
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          platforms: ${{ env.SUPPORTED_PLATFORMS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MIKROZIA_VERSION=${{ env.RELEASE_TAG }}
            XRAY_VERSION=${{ env.XRAY_VERSION }}
            MTG_VERSION=${{ env.MTG_VERSION }}

      - name: Write release summary
        run: |
          {
            echo "## Published Mikrozia"
            echo ""
            echo "- Image: \`$IMAGE_NAME:$RELEASE_TAG\`"
            echo "- Xray Version: \`$XRAY_VERSION\`"
            echo "- MTG Version: \`$MTG_VERSION\`"
            echo "- Architectures (each smoke-tested before publish): \`$SUPPORTED_PLATFORMS\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
