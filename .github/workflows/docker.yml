name: Publish Mikrozia Container

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*-mikrozia.*"
    paths:
      - MIKROZIA_VERSION
  workflow_dispatch:
    inputs:
      version:
        description: "Docker tag, for example v3.11.0-mikrozia.4"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mikrozia-docker-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  IMAGE_NAME: majlot/mikrozia

jobs:
  validate:
    name: Validate RouterOS container release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release tag
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${DISPATCH_VERSION}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            release_tag="$(tr -d '[:space:]' < MIKROZIA_VERSION)"
          fi
          echo "RELEASE_TAG=${release_tag}" >> "$GITHUB_ENV"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-mikrozia\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            echo "Expected format: v3.11.0-mikrozia.4" >&2
            exit 1
          fi

      - name: Run Mikrozia compatibility tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Validate shell syntax
        run: |
          sh -n DockerEntrypoint.sh
          sh -n DockerInit.sh
          bash -n x-ui.sh

      - name: Assert firewall-free RouterOS installers
        shell: bash
        run: |
          if grep -R '/ip/firewall' scripts/routeros scripts/generator; then
            echo "RouterOS installer/generator must not manage firewall or NAT." >&2
            exit 1
          fi
          if grep -E -i '\b(iptables|ip6tables|nftables|ufw|fail2ban)\b' DockerEntrypoint.sh Dockerfile x-ui.sh; then
            echo "The MikroTik container image must not include firewall-management tooling or commands." >&2
            exit 1
          fi

  smoke-amd64:
    name: Build and smoke-test linux/amd64
    needs: validate
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: mikrozia-smoke:${{ env.RELEASE_TAG }}
          build-args: |
            MIKROZIA_VERSION=${{ env.RELEASE_TAG }}

      - name: Verify RouterOS runtime contract
        shell: bash
        run: |
          docker image inspect "mikrozia-smoke:$RELEASE_TAG"
          docker run --rm --entrypoint /bin/sh "mikrozia-smoke:$RELEASE_TAG" -ec '
            test -x /app/x-ui
            test -x /app/DockerEntrypoint.sh
            test -x /app/bin/xray-linux-amd64
            test -d /etc/x-ui
            test -d /root/cert
            test "$XUI_IN_DOCKER" = true
            test "$HOME" = /root
          '

      - name: Run image integration tests
        env:
          MIKROZIA_TEST_IMAGE: mikrozia-smoke:${{ env.RELEASE_TAG }}
        run: python3 -m unittest tests.test_first_login_and_credentials

  publish:
    name: Publish multi-architecture image
    needs: [validate, smoke-amd64]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Mikrozia
            org.opencontainers.image.description=3x-ui adapted for MikroTik RouterOS containers
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}

      - name: Build and push RouterOS-supported architectures
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          platforms: linux/amd64,linux/arm64/v8,linux/arm/v7
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MIKROZIA_VERSION=${{ env.RELEASE_TAG }}

      - name: Write release summary
        run: |
          {
            echo "## Published Mikrozia"
            echo ""
            echo "- Image: \`$IMAGE_NAME:$RELEASE_TAG\`"
            echo "- Architectures: linux/amd64, linux/arm64/v8, linux/arm/v7"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
